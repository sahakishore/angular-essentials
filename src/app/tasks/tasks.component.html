
@if(isAddingTask){
  <app-new-task (cancel)="onCancelAddTask()" (addTask)="onAddTask($event)"/>
}

<section>
  <header>
    <h2>{{name}}'s Task</h2>

    <menu>
      <button
        (click)="onStartAddTask()"
      >Add Task</button>
    </menu>
  </header>

  <ul>
    @for(task of selectedUserTasks; track task.id){
      <li>
        <app-task
          (complete)="onCompleteTask($event)"
          [task]="task"
        ></app-task>
      </li>
    }

  </ul>

</section>

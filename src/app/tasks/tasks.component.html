
@if(isAddingTask){
  <!-- <app-new-task [userId]="userIdIncoming" (cancel)="onCancelAddTask()" (addTask)="onAddTask($event)"/> -->
  <app-new-task [userId]="userIdIncoming" (close)="onCloseAddTask()" />
}

<section>
  <header>
    <h2>{{name}}'s Task</h2>

    <menu>
      <button
        (click)="onStartAddTask()"
      >Add Task</button>
    </menu>
  </header>

  <ul>
    @for(task of selectedUserTasks; track task.id){
      <li>
        <app-task

          [task]="task"
        ></app-task>
      </li>
    }

  </ul>

</section>
